<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kush-pages</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a14;
    color: #f1f5f9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .card {
    max-width: 560px;
    background: #131321;
    border: 1px solid #1f1f33;
    border-radius: 14px;
    padding: 2.5rem;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
  h1 span { color: #fbbf24; }
  p { color: #94a3b8; line-height: 1.6; margin-bottom: 1rem; font-size: 0.92rem; }
  code { background: #0a0a14; border: 1px solid #1f1f33; padding: 0.15rem 0.4rem; border-radius: 4px; font-size: 0.85rem; color: #fbbf24; }
  a { color: #fbbf24; }
</style>
</head>
<body>
  <div class="card">
    <h1><span>⬡</span> kush-pages</h1>
    <p>Hosting público de apresentações geradas pelo Kush-Dev.</p>
    <p>Cada projeto vive em sua própria subpasta. Para ver uma apresentação específica, use o link compartilhado no Telegram.</p>
    <p>Exemplos: <code>/crm-pro/v1.html</code> · <code>/kush-dev/v1-leigo.html</code> · <code>/chatflow/mindmap.html</code></p>
  </div>
</body>
</html>
