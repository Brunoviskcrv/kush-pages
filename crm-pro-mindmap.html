<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa Mental — CRM Pro">
<title>Mapa Mental — CRM Pro</title>
<style>
  :root {
    --primary: #F0B429;
    --bg: #0a0a14;
    --surface: #131321;
    --border: #1f1f33;
    --text: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .brand { display: flex; flex-direction: column; gap: 0.2rem; }
  .title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .title .dot { color: var(--primary); }
  .tagline { font-size: 0.78rem; color: var(--text-3); }
  .hint { font-size: 0.7rem; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
  main {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #mindmap { display: block; background: var(--bg); }
  footer {
    padding: 0.6rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.68rem;
    color: var(--text-3);
    text-align: center;
  }
  footer .sig { color: var(--text-2); }
  @media (max-width: 640px) {
    header { padding: 0.75rem 1rem; }
    .title { font-size: 0.85rem; }
    .tagline { font-size: 0.68rem; }
    .hint { display: none; }
  }
</style>
<!-- Carrega markmap mas SEM autoloader rodar; usaremos API direta -->
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="title"><span class="dot">⬡</span> Mapa Mental — CRM Pro</div>
      <div class="tagline">CRM enterprise com RBAC, autenticação via Telegram e dashboard em tempo real para 51.820 clientes em produção</div>
    </div>
    <div class="hint">scroll &amp; zoom para navegar</div>
  </header>
  <main id="mindmap-wrap">
    <svg id="mindmap"></svg>
  </main>
  <footer>
    <span class="sig">Bruno Visk — @Brunoviskcrv</span> · gerado por kush-dev
  </footer>
<script>
const MARKMAP_MD = "# CRM Pro\n## \ud83d\udd10 Autentica\u00e7\u00e3o\n### Telegram OTP (6 d\u00edgitos)\n### JWT \u2014 expira 19h BRT\n### Revoga\u00e7\u00e3o por session_version\n### Rate limit: 3 req/min por @username\n## \ud83d\udc65 RBAC\n### Roles\n#### vendedor \u2014 loja pr\u00f3pria\n#### admin \u2014 todas as lojas\n#### gestao \u2014 dados financeiros\n### Permiss\u00f5es granulares\n#### ver_financeiro\n#### ver_comparativo\n#### ver_top_clientes\n#### ver_relatorio\n#### gerenciar_usuarios\n## \ud83d\udcca Dashboard\n### M\u00e9tricas operacionais\n#### Total / VIP / Em Risco / Perdidos\n#### Inatividade 0-30 / 31-60 / 61-90 / 90+\n### Feed de atividade recente\n### Follow-ups do dia\n### Dashboard Comparativo (gestao)\n#### Receita 3 meses\n#### Breakdown 6 lojas\n## \ud83d\udc65 Contatos\n### 51.820 clientes\n### Segmentos: VIP / Em Risco / Perdido / Regular / Fiel / Novo / Lead\n### Term\u00f4metro: Quente / Morno / Frio / Convertido\n### Bulk term\u00f4metro (at\u00e9 500)\n### Export CSV (admin+gestao)\n## \ud83d\uddc4\ufe0f Banco MySQL\n### clients \u2014 51.820 registros\n### crm_users \u2014 roles + permissoes + session_version\n### crm_auth_codes \u2014 OTP TTL 5min\n### crm_overrides \u2014 edi\u00e7\u00f5es manuais fase/term\u00f4metro\n### pedido_loja \u2014 hist\u00f3rico de pedidos\n## \ud83c\udf10 API REST\n### /auth/telegram/request\n### /auth/telegram/verify\n### /api/stats\n### /api/stats/top-clientes\n### /api/stats/inatividade\n### /api/stats/period (gestao)\n### /api/stats/period-by-loja\n### /api/clients\n### /api/clients/bulk-termometro\n### /api/clients/followups\n### /admin/users/:id/suspend\n### /admin/users/:id/revoke\n## \ud83d\ude80 Infra\n### Railway \u2014 auto-deploy on push\n### Node.js 20\n### Offline-first (localStorage + sync)\n### Frontend HTML5 standalone (~5000 linhas)";
let mmInstance = null;

function getDimensions() {
  const isMobile = window.innerWidth <= 640;
  const headerH = isMobile ? 56 : 64;
  const footerH = isMobile ? 28 : 32;
  const w = window.innerWidth;
  const h = Math.max(380, window.innerHeight - headerH - footerH);
  return { w, h };
}

function sizeSvg() {
  const { w, h } = getDimensions();
  const main = document.getElementById('mindmap-wrap');
  const svg = document.getElementById('mindmap');
  main.style.height = h + 'px';
  // SVG precisa de atributos width/height (não só style) para
  // getBoundingClientRect retornar valores corretos — d3/markmap depende disso.
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
}

function renderMindmap() {
  if (!window.markmap || !window.markmap.Markmap) {
    setTimeout(renderMindmap, 100);
    return;
  }
  const { Markmap, Transformer } = window.markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(MARKMAP_MD);
  const svg = document.getElementById('mindmap');
  if (mmInstance) {
    try { mmInstance.destroy(); } catch (e) {}
    svg.innerHTML = '';
  }
  sizeSvg();
  mmInstance = Markmap.create(svg, null, root);
  // fit já é chamado por create, mas garantimos um segundo fit após reflow
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try { mmInstance.fit(); } catch (e) {}
    });
  });
}

// Inicializa dimensões IMEDIATAMENTE (antes mesmo do load)
sizeSvg();
// Render quando DOM + markmap estão prontos
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderMindmap);
} else {
  renderMindmap();
}

// Mobile: orientationchange → recria com dimensões novas
window.addEventListener('orientationchange', () => {
  setTimeout(renderMindmap, 300);
});
// Desktop: resize debounced refit
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeSvg();
    try { mmInstance?.fit(); } catch (e) {}
  }, 200);
});
</script>
</body>
</html>
