<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa Mental — Kush-Dev">
<title>Mapa Mental — Kush-Dev</title>
<style>
  :root {
    --primary: #F97316;
    --bg: #0a0a14;
    --surface: #131321;
    --border: #1f1f33;
    --text: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .brand { display: flex; flex-direction: column; gap: 0.2rem; }
  .title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .title .dot { color: var(--primary); }
  .tagline { font-size: 0.78rem; color: var(--text-3); }
  .hint { font-size: 0.7rem; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
  main {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #mindmap { display: block; background: var(--bg); }
  footer {
    padding: 0.6rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.68rem;
    color: var(--text-3);
    text-align: center;
  }
  footer .sig { color: var(--text-2); }
  @media (max-width: 640px) {
    header { padding: 0.75rem 1rem; }
    .title { font-size: 0.85rem; }
    .tagline { font-size: 0.68rem; }
    .hint { display: none; }
  }
</style>
<!-- Carrega markmap mas SEM autoloader rodar; usaremos API direta -->
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="title"><span class="dot">⬡</span> Mapa Mental — Kush-Dev</div>
      <div class="tagline">Bot Telegram que transforma ideias em repositórios GitHub funcionando — do texto ao código, testado e publicado.</div>
    </div>
    <div class="hint">scroll &amp; zoom para navegar</div>
  </header>
  <main id="mindmap-wrap">
    <svg id="mindmap"></svg>
  </main>
  <footer>
    <span class="sig">Bruno de Carvalho — Kush-Dev</span> · gerado por kush-dev
  </footer>
<script>
const MARKMAP_MD = "# Kush-Dev\n\n## Bot Telegram\n### /criar\n- Research \u2192 Briefing \u2192 Aprova\u00e7\u00e3o \u2192 Gera\u00e7\u00e3o \u2192 Sandbox \u2192 GitHub\n### /melhorar\n- Leitura de repo \u2192 Fase Zero \u2192 Protected Paths \u2192 Edi\u00e7\u00e3o cir\u00fargica \u2192 PR\n### /apresentar\n- L\u00ea repo ou site \u2192 HTML profissional self-contained \u2192 Telegram doc\n### Esteira de Pend\u00eancias\n- /pendente \u2192 /pendencias \u2192 /proximo \u2192 /aprovar\n\n## IA Multi-Provider\n### Tier Pesado (c\u00f3digo)\n- Claude Sonnet (default)\n- GPT-4o, DeepSeek, Mistral, Grok\n### Tier Leve (pesquisa, perguntas)\n- Groq/Llama 3.3 70B (preferido)\n- Together, Ollama, Gemini, Claude Haiku\n### Roteamento\n- router.py: light() e heavy()\n- /modelo troca provider\n- Fallback autom\u00e1tico em runtime\n\n## Seguran\u00e7a\n### Sprint 1 (implementado)\n- 1.1 Protected Paths\n- 1.2 Self-Detection / Modo Paranoico\n- 1.3 Fase Zero \u2014 lockfile constraints\n### Sprint 2\u20133 (pendente)\n- Teste de Coer\u00eancia sem\u00e2ntica\n- Relat\u00f3rio de performance por agente\n\n## Infraestrutura\n- Railway PaaS + Procfile + Nixpacks\n- PostgreSQL: tasks, projects, user_preferences\n- Sandbox /tmp isolado, timeout 30s\n- Deploy autom\u00e1tico no push\n\n## Filosofia\n- NORTH_STAR: evoluir, n\u00e3o entregar\n- 1% ao dia \u00e9 o m\u00ednimo\n- Clarificar antes de construir\n- Autonomia + transpar\u00eancia";
let mmInstance = null;

function getDimensions() {
  const isMobile = window.innerWidth <= 640;
  const headerH = isMobile ? 56 : 64;
  const footerH = isMobile ? 28 : 32;
  const w = window.innerWidth;
  const h = Math.max(380, window.innerHeight - headerH - footerH);
  return { w, h };
}

function sizeSvg() {
  const { w, h } = getDimensions();
  const main = document.getElementById('mindmap-wrap');
  const svg = document.getElementById('mindmap');
  main.style.height = h + 'px';
  // SVG precisa de atributos width/height (não só style) para
  // getBoundingClientRect retornar valores corretos — d3/markmap depende disso.
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
}

function renderMindmap() {
  if (!window.markmap || !window.markmap.Markmap) {
    setTimeout(renderMindmap, 100);
    return;
  }
  const { Markmap, Transformer } = window.markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(MARKMAP_MD);
  const svg = document.getElementById('mindmap');
  if (mmInstance) {
    try { mmInstance.destroy(); } catch (e) {}
    svg.innerHTML = '';
  }
  sizeSvg();
  mmInstance = Markmap.create(svg, null, root);
  // fit já é chamado por create, mas garantimos um segundo fit após reflow
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try { mmInstance.fit(); } catch (e) {}
    });
  });
}

// Inicializa dimensões IMEDIATAMENTE (antes mesmo do load)
sizeSvg();
// Render quando DOM + markmap estão prontos
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderMindmap);
} else {
  renderMindmap();
}

// Mobile: orientationchange → recria com dimensões novas
window.addEventListener('orientationchange', () => {
  setTimeout(renderMindmap, 300);
});
// Desktop: resize debounced refit
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeSvg();
    try { mmInstance?.fit(); } catch (e) {}
  }, 200);
});
</script>
</body>
</html>
