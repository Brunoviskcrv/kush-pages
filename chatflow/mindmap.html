<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa Mental — ChatFlow">
<title>Mapa Mental — ChatFlow</title>
<style>
  :root {
    --primary: #4f46e5;
    --bg: #0a0a14;
    --surface: #131321;
    --border: #1f1f33;
    --text: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .brand { display: flex; flex-direction: column; gap: 0.2rem; }
  .title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .title .dot { color: var(--primary); }
  .tagline { font-size: 0.78rem; color: var(--text-3); }
  .hint { font-size: 0.7rem; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
  main {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #mindmap { display: block; background: var(--bg); }
  footer {
    padding: 0.6rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.68rem;
    color: var(--text-3);
    text-align: center;
  }
  footer .sig { color: var(--text-2); }
  @media (max-width: 640px) {
    header { padding: 0.75rem 1rem; }
    .title { font-size: 0.85rem; }
    .tagline { font-size: 0.68rem; }
    .hint { display: none; }
  }
</style>
<!-- Carrega markmap mas SEM autoloader rodar; usaremos API direta -->
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="title"><span class="dot">⬡</span> Mapa Mental — ChatFlow</div>
      <div class="tagline">Plataforma de atendimento omnichannel via chat com IA, widget embed e painel de operadores em tempo real</div>
    </div>
    <div class="hint">scroll &amp; zoom para navegar</div>
  </header>
  <main id="mindmap-wrap">
    <svg id="mindmap"></svg>
  </main>
  <footer>
    <span class="sig">Gerado por Kush-Dev</span> · gerado por kush-dev
  </footer>
<script>
const MARKMAP_MD = "# ChatFlow\n## Backend (Node.js + Express)\n### Rotas REST\n- /api/auth (login, register, me)\n- /api/chats (lista, mensagens, status, resumo)\n- /api/conversations (start, mute)\n- /api/email (inbound, webhook, reply, channels)\n- /api/operators (CRUD, atribui\u00e7\u00f5es de canal)\n- /api/quick-replies (pessoal, global, auto-save)\n- /api/reports (welcome, stats)\n- /api/business-hours (config, status)\n- /api/media/upload\n### WebSocket (Socket.io)\n- Namespace /widget\n- Namespace /dashboard\n### Servi\u00e7os\n- email.service (receber + responder)\n- business-hours.service\n- IA (Claude \u2014 resumos)\n### Banco (PostgreSQL)\n- users\n- conversations\n- messages\n- ai_summaries\n- email_channels\n- telegram_channels\n- channel_operators\n- quick_replies / global_quick_replies\n- message_frequency\n- settings\n## Dashboard (React + Vite)\n- Fila de conversas em tempo real\n- Chat com operador\n- Painel de relat\u00f3rios\n- Gest\u00e3o de operadores\n- Configura\u00e7\u00e3o de canais\n- Mensagens r\u00e1pidas\n- Hor\u00e1rios de atendimento\n## Widget (React + Vite IIFE)\n- Embed via script tag\n- Mount via JS API\n- Tema configur\u00e1vel\n- Conex\u00e3o Socket.io /widget\n## Canais\n- Widget (site embed)\n- E-mail (Cloudflare / Mailgun)\n- Telegram (GramJS)";
let mmInstance = null;

function getDimensions() {
  const isMobile = window.innerWidth <= 640;
  const headerH = isMobile ? 56 : 64;
  const footerH = isMobile ? 28 : 32;
  const w = window.innerWidth;
  const h = Math.max(380, window.innerHeight - headerH - footerH);
  return { w, h };
}

function sizeSvg() {
  const { w, h } = getDimensions();
  const main = document.getElementById('mindmap-wrap');
  const svg = document.getElementById('mindmap');
  main.style.height = h + 'px';
  // SVG precisa de atributos width/height (não só style) para
  // getBoundingClientRect retornar valores corretos — d3/markmap depende disso.
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
}

function renderMindmap() {
  if (!window.markmap || !window.markmap.Markmap) {
    setTimeout(renderMindmap, 100);
    return;
  }
  const { Markmap, Transformer } = window.markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(MARKMAP_MD);
  const svg = document.getElementById('mindmap');
  if (mmInstance) {
    try { mmInstance.destroy(); } catch (e) {}
    svg.innerHTML = '';
  }
  sizeSvg();
  mmInstance = Markmap.create(svg, null, root);
  // fit já é chamado por create, mas garantimos um segundo fit após reflow
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try { mmInstance.fit(); } catch (e) {}
    });
  });
}

// Inicializa dimensões IMEDIATAMENTE (antes mesmo do load)
sizeSvg();
// Render quando DOM + markmap estão prontos
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderMindmap);
} else {
  renderMindmap();
}

// Mobile: orientationchange → recria com dimensões novas
window.addEventListener('orientationchange', () => {
  setTimeout(renderMindmap, 300);
});
// Desktop: resize debounced refit
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeSvg();
    try { mmInstance?.fit(); } catch (e) {}
  }, 200);
});
</script>
</body>
</html>
