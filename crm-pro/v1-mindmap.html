<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Mapa Mental — CRM Pro">
<title>Mapa Mental — CRM Pro</title>
<style>
  :root {
    --primary: #F0B429;
    --bg: #0a0a14;
    --surface: #131321;
    --border: #1f1f33;
    --text: #f1f5f9;
    --text-2: #94a3b8;
    --text-3: #64748b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .brand { display: flex; flex-direction: column; gap: 0.2rem; }
  .title { font-size: 1rem; font-weight: 700; color: var(--text); }
  .title .dot { color: var(--primary); }
  .tagline { font-size: 0.78rem; color: var(--text-3); }
  .hint { font-size: 0.7rem; color: var(--text-3); font-family: 'JetBrains Mono', monospace; }
  main {
    position: relative;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
  }
  #mindmap { display: block; background: var(--bg); }
  footer {
    padding: 0.6rem 1.5rem;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: 0.68rem;
    color: var(--text-3);
    text-align: center;
  }
  footer .sig { color: var(--text-2); }
  @media (max-width: 640px) {
    header { padding: 0.75rem 1rem; }
    .title { font-size: 0.85rem; }
    .tagline { font-size: 0.68rem; }
    .hint { display: none; }
  }
</style>
<!-- Carrega markmap mas SEM autoloader rodar; usaremos API direta -->
<script src="https://cdn.jsdelivr.net/npm/markmap-autoloader@0.16"></script>
</head>
<body>
  <header>
    <div class="brand">
      <div class="title"><span class="dot">⬡</span> Mapa Mental — CRM Pro</div>
      <div class="tagline">CRM enterprise multi-loja com RBAC, auth Telegram e 51.820 clientes em produção</div>
    </div>
    <div class="hint">scroll &amp; zoom para navegar</div>
  </header>
  <main id="mindmap-wrap">
    <svg id="mindmap"></svg>
  </main>
  <footer>
    <span class="sig">Bruno Visk — @brncrv</span> · gerado por kush-dev
  </footer>
<script>
const MARKMAP_MD = "# CRM Pro\n## Auth\n### Telegram OTP (6 d\u00edgitos, 5 min)\n### JWT (exp 19h BRT, session_version)\n### Revoga\u00e7\u00e3o de emerg\u00eancia (\u003c60s)\n### Fallback API Key (server-to-server)\n## RBAC\n### Roles: gestao / admin / vendedor\n### Permiss\u00f5es granulares (5 toggles)\n### Filtro autom\u00e1tico por loja\n### Dados financeiros protegidos\n## Clientes (51.820)\n### Fases: VIP / Em Risco / Perdido / Regular / Fiel / Novo / Lead\n### Term\u00f4metro: Quente / Morno / Frio / Convertido\n### Inatividade: 0-30 / 31-60 / 61-90 / 90+ dias\n### Timeline de tratativas por cliente\n## Multi-loja (6 lojas)\n### Dashboard por loja\n### Breakdown comparativo mensal\n### Filtro em tempo real\n## API REST\n### /api/stats \u2014 m\u00e9tricas globais\n### /api/stats/period \u2014 receita 3 meses (gestao)\n### /api/stats/top-clientes \u2014 ranking com gasto\n### /api/stats/inatividade \u2014 segmenta\u00e7\u00e3o\n### /api/clients \u2014 lista + filtros\n### /api/clients/bulk-termometro \u2014 a\u00e7\u00e3o em massa\n### /auth/telegram/* \u2014 login OTP\n### /admin/users/* \u2014 gerenciar usu\u00e1rios\n## Frontend\n### HTML5 standalone (~5000 linhas)\n### Dashboard operacional\n### P\u00e1gina Contatos (busca + filtros)\n### Timeline cronol\u00f3gica\n### Calend\u00e1rio de follow-ups\n### Dashboard Comparativo (gestao)\n### Filtros avan\u00e7ados com presets\n### Painel Admin (usu\u00e1rios + permiss\u00f5es)\n## Infra\n### Railway (auto-deploy no push main)\n### MySQL Railway Managed\n### Offline-first (localStorage + sync)\n### Rate limiting por IP e por usu\u00e1rio";
let mmInstance = null;

function getDimensions() {
  const isMobile = window.innerWidth <= 640;
  const headerH = isMobile ? 56 : 64;
  const footerH = isMobile ? 28 : 32;
  const w = window.innerWidth;
  const h = Math.max(380, window.innerHeight - headerH - footerH);
  return { w, h };
}

function sizeSvg() {
  const { w, h } = getDimensions();
  const main = document.getElementById('mindmap-wrap');
  const svg = document.getElementById('mindmap');
  main.style.height = h + 'px';
  // SVG precisa de atributos width/height (não só style) para
  // getBoundingClientRect retornar valores corretos — d3/markmap depende disso.
  svg.setAttribute('width', w);
  svg.setAttribute('height', h);
  svg.style.width = w + 'px';
  svg.style.height = h + 'px';
}

function renderMindmap() {
  if (!window.markmap || !window.markmap.Markmap) {
    setTimeout(renderMindmap, 100);
    return;
  }
  const { Markmap, Transformer } = window.markmap;
  const transformer = new Transformer();
  const { root } = transformer.transform(MARKMAP_MD);
  const svg = document.getElementById('mindmap');
  if (mmInstance) {
    try { mmInstance.destroy(); } catch (e) {}
    svg.innerHTML = '';
  }
  sizeSvg();
  mmInstance = Markmap.create(svg, null, root);
  // fit já é chamado por create, mas garantimos um segundo fit após reflow
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      try { mmInstance.fit(); } catch (e) {}
    });
  });
}

// Inicializa dimensões IMEDIATAMENTE (antes mesmo do load)
sizeSvg();
// Render quando DOM + markmap estão prontos
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', renderMindmap);
} else {
  renderMindmap();
}

// Mobile: orientationchange → recria com dimensões novas
window.addEventListener('orientationchange', () => {
  setTimeout(renderMindmap, 300);
});
// Desktop: resize debounced refit
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    sizeSvg();
    try { mmInstance?.fit(); } catch (e) {}
  }, 200);
});
</script>
</body>
</html>
